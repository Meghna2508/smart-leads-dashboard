services:
  mongo:
    image: mongo:7
    container_name: smart-leads-mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: smart-leads-server
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      MONGO_URI: mongodb://smart-leads-mongo:27017/smart-leads
      JWT_SECRET: supersecretjwtkey123456789abcdef
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:3000
      NODE_ENV: development
    depends_on:
      - mongo
    networks:
      - app-network
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: smart-leads-client
    ports:
      - '3000:3000'
    depends_on:
      - server
    networks:
      - app-network
    restart: unless-stopped

volumes:
  mongo_data:

networks:
  app-network:
    driver: bridge